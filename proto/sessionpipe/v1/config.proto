// The machine's own files, which no receiver ever sees (RFC 0001 §8): today the person's trigger
// rules, `<config>/triggers.json` (spec/CONTROL.md §14), and what `sessionpipe trigger … --json`
// prints about them. Nothing here is on the wire. The CLI writes the file, the daemon reads it,
// and both read these shapes; packages/core/gen/config.ts and config-schemas.ts are generated
// from this file, and nothing is published under schemas/v1.
syntax = "proto3";

package sessionpipe.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "sessionpipe/v1/control.proto";
import "sessionpipe/v1/options.proto";

// What became of a run of a rule: a notice or a clock tick the rule took (CONTROL.md §14).
enum TriggerResult {
  // None.
  TRIGGER_RESULT_UNSPECIFIED = 0;
  // The run began.
  TRIGGER_RESULT_RAN = 1;
  // The machine said no; the line's `code` says why.
  TRIGGER_RESULT_REFUSED = 2;
  // The run could not begin: the harness failed to start.
  TRIGGER_RESULT_FAILED = 3;
}

// Which part of a rule a notice did not fit (`sessionpipe trigger test`). The machine's own
// word, for the person at its terminal: never in an ack, which says `no_match` alone.
enum TriggerMiss {
  // None.
  TRIGGER_MISS_UNSPECIFIED = 0;
  // The notice came from another receiver, or the rule runs on a clock.
  TRIGGER_MISS_RECEIVER = 1;
  // Another topic.
  TRIGGER_MISS_TOPIC = 2;
  // Another event than the one the rule names.
  TRIGGER_MISS_EVENT = 3;
  // A state the rule doesn't list, or none where it lists some.
  TRIGGER_MISS_STATE = 4;
  // Someone the rule doesn't list in `for`, or no one where it lists some.
  TRIGGER_MISS_FOR = 5;
  // Someone the rule doesn't list in `by`, or no one where it lists some.
  TRIGGER_MISS_BY = 6;
  // A subject the rule's pattern doesn't match.
  TRIGGER_MISS_SUBJECT = 7;
  // The rule's words name a field (`{state}`, `{for}`, `{by}`) the notice doesn't carry.
  TRIGGER_MISS_PLACEHOLDER = 8;
}

// A rule's notices: one receiver the machine is paired with, and one topic.
message NoticeSource {
  option (sessionpipe.v1.strict) = true;
  // The receiver, as the machine names it: the host (and port, when there is one) of the
  // address it was paired with, lowercase (`board.example`).
  string receiver = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      max_len: 259
      pattern: "^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?(?::[0-9]{1,5})?$"
    }
  ];
  // The topic, listed in the hello to that receiver and to no other.
  string topic = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._/-]{0,79}$"
  ];
  // Only notices of this event; any event when absent.
  string event = 3 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9_.]{0,39}$"];
}

// A rule's clock: it runs with no receiver at all, in the machine's local time.
message ClockSource {
  option (sessionpipe.v1.strict) = true;
  // `mon 09:00` to `sun 09:00` once a week, `day 08:30` every day, or an interval: `30m`, `2h`.
  // Beyond the pattern the reader checks an interval is 15 minutes to 7 days.
  string every = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^(?:(?:mon|tue|wed|thu|fri|sat|sun|day) (?:[01][0-9]|2[0-3]):[0-5][0-9]|[1-9][0-9]{0,4}[mh])$"
  ];
}

// When a rule runs, exactly one of: a receiver's notice on a topic, or a clock.
message TriggerSource {
  option (sessionpipe.v1.either) = true;
  // On a notice.
  NoticeSource notice = 1;
  // On a clock.
  ClockSource clock = 2;
}

// A new session of a harness this machine runs headlessly.
message StartTarget {
  option (sessionpipe.v1.strict) = true;
  // The harness (`claude-code`, `codex`).
  string start = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,39}$"
  ];
}

// An existing session, continued with the rule's words.
message ContinueTarget {
  option (sessionpipe.v1.strict) = true;
  // The session, `<harness>:<id>`; the id follows its adapter's rule (Claude Code: a UUID).
  string continue = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,39}:[A-Za-z0-9._:-]{1,128}$"
  ];
}

// What a rule runs, exactly one of: a new session, or an existing one continued.
message TriggerTarget {
  option (sessionpipe.v1.either) = true;
  // A new session.
  StartTarget start = 1;
  // An existing session.
  ContinueTarget continue = 2;
}

// Which notices a rule takes beyond its source. Each list allows only its values, an absent
// or empty list allows any, and a notice without the field fits no list.
message TriggerWhen {
  option (sessionpipe.v1.strict) = true;
  // The states it takes (`todo`).
  repeated string state = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 20
    unique: true
    items: {
      string: {pattern: "^[a-z0-9_-]{1,32}$"}
    }
  }];
  // Whom the subject must be for (`studio-claude`).
  repeated string for = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 20
    unique: true
    items: {
      string: {pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$"}
    }
  }];
  // Who must have made the change (`u-41c9`): how a rule keeps to the people it trusts.
  repeated string by = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 20
    unique: true
    items: {
      string: {pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$"}
    }
  }];
}

// How often a rule may run.
message TriggerCap {
  option (sessionpipe.v1.strict) = true;
  // Runs a day at most, by the machine's local calendar. Every run counts, whether it then
  // works or fails.
  int32 per_day = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 50
    }
  ];
}

// One of the person's rules (CONTROL.md §14), made only at the machine's own terminal, shown in
// plain words and confirmed there. No command and no notice makes, changes, pauses, resumes or
// removes one.
message TriggerRule {
  option (sessionpipe.v1.strict) = true;
  // The rule's name: what `triggered_by` carries and the CLI names it by.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,39}$"
  ];
  // A paused rule runs nothing, and its topic leaves the hello.
  bool paused = 2 [(google.api.field_behavior) = REQUIRED];
  // When it runs.
  TriggerSource source = 3 [(google.api.field_behavior) = REQUIRED];
  // A notice rule only: which notices it takes, beyond its source.
  TriggerWhen when = 4;
  // A notice rule only: the subjects it takes, in the safe pattern language of CONTROL.md
  // §14 (`^X-[0-9]{1,6}$`): anchored, no groups, no alternation, matched without
  // backtracking. The reader compiles it; one that doesn't compile is refused.
  string subject = 5 [(buf.validate.field).string = {
    min_len: 2
    max_len: 100
    pattern: "^\\^.*\\$$"
  }];
  // What it runs.
  TriggerTarget target = 6 [(google.api.field_behavior) = REQUIRED];
  // The folder it runs in: absolute, or `~` / `~/…` under the daemon's user's home. Checked
  // against the machine's allowlist again at every run.
  string folder = 7 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
    }
  ];
  // The widest level it runs at; a run gets the narrower of this, the machine's mode and,
  // continuing, the session's own level. A notice rule is `edits` at most: the receiver
  // holds other people's text. The reader checks that.
  StartPermission level = 8 [(google.api.field_behavior) = REQUIRED];
  // MCP servers or tools (`mcp__board`, `mcp__board__records_get`) its runs may use without
  // asking, as `control.session_tools` (HTTP.md §1) are: never a built-in tool, never a
  // shell pattern.
  repeated string tools = 9 [(buf.validate.field).repeated = {
    max_items: 8
    unique: true
    items: {
      string: {pattern: "^mcp__[A-Za-z0-9_-]{1,64}$"}
    }
  }];
  // How often it may run.
  TriggerCap cap = 10 [(google.api.field_behavior) = REQUIRED];
  // The person's words for the session. A notice rule's may name `{subject}`, `{state}`,
  // `{for}` and `{by}`, each filled with the notice's token in backticks; no other brace,
  // and a clock rule's none. No control character but tab and line breaks.
  string words = 11 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 4000
      pattern: "^[^\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f\\x7f]+$"
    }
  ];
}

// `<config>/triggers.json` (mode 0600), written by the CLI only and read by the daemon, as the
// mode and the folders are. A file that doesn't fit is read as no rules and triggers off,
// never guessed at.
message TriggersFile {
  option (sessionpipe.v1.strict) = true;
  // Always 1.
  int32 v = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32.const = 1
  ];
  // Whether triggers are on: the person's switch at the machine (`sessionpipe triggers on`).
  // Off until they turn it on.
  bool on = 2 [(google.api.field_behavior) = REQUIRED];
  // The rules, in the order a notice is tried against them: the first that takes it runs.
  repeated TriggerRule rules = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.max_items = 50
  ];
}

// One line of a rule's history: a run, a refusal or a failure (`trigger list`).
message TriggerHistoryLine {
  // When.
  string at = 1 [
    (google.api.field_behavior) = REQUIRED,
    (sessionpipe.v1.format) = FORMAT_DATE_TIME
  ];
  // What became of it.
  TriggerResult result = 2 [(google.api.field_behavior) = REQUIRED];
  // refused: why.
  TriggerRefusal code = 3;
  // The notice's subject; absent for a clock tick.
  string subject = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$"];
  // The notice's state, when it had one.
  string state = 5 [(buf.validate.field).string.pattern = "^[a-z0-9_-]{1,32}$"];
  // ran: the session, `<harness>:<id>`.
  string session = 6 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,39}:[A-Za-z0-9._:-]{1,128}$"];
  // ran: how long the run took, in milliseconds, once it ended.
  int64 ms = 7 [(buf.validate.field).int64.gte = 0];
}

// One rule as `sessionpipe trigger list --json` prints it.
message TriggerListEntry {
  // The rule, as the file has it.
  TriggerRule rule = 1 [(google.api.field_behavior) = REQUIRED];
  // Its runs today, against `cap.per_day`.
  int32 today = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32.gte = 0
  ];
  // Its latest lines, newest first.
  repeated TriggerHistoryLine recent = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.max_items = 20
  ];
}

// `sessionpipe trigger list --json`.
message TriggerList {
  // Whether triggers are on.
  bool on = 1 [(google.api.field_behavior) = REQUIRED];
  // Every rule, in the file's order.
  repeated TriggerListEntry rules = 2 [(google.api.field_behavior) = REQUIRED];
}

// What one run of a rule is, as the daemon would start it.
message TriggerRun {
  // A new session of a harness, or an existing one continued.
  TriggerTarget target = 1 [(google.api.field_behavior) = REQUIRED];
  // The folder.
  string folder = 2 [(google.api.field_behavior) = REQUIRED];
  // The level, already the narrower of the rule's and the machine's mode.
  StartPermission level = 3 [(google.api.field_behavior) = REQUIRED];
  // The MCP tools it may use without asking.
  repeated string tools = 4 [(google.api.field_behavior) = REQUIRED];
  // The words the session is given, framed and with the notice's tokens in backticks.
  string words = 5 [(google.api.field_behavior) = REQUIRED];
}

// `sessionpipe trigger test <name> --json`: what a sample notice, or a tick, would run. It runs
// nothing and records nothing.
message TriggerTestAnswer {
  // The rule's name.
  string rule = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9_-]{0,39}$"
  ];
  // The sample notice; absent for a clock rule.
  ControlNotice notice = 2;
  // Whether the rule takes it.
  bool matches = 3 [(google.api.field_behavior) = REQUIRED];
  // When it doesn't: which part of the rule it does not fit.
  TriggerMiss miss = 4;
  // A check that would refuse it now (triggers off, the cap, the folder), when one would.
  TriggerRefusal refusal = 5;
  // When it matches: what would run.
  TriggerRun run = 6;
}
