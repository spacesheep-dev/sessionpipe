<svg viewBox="0 0 960 318" role="img" aria-label="Architecture: eight coding-agent harnesses fire hooks into one adapter each; the adapters feed sessionpipe core, which normalises, filters to a tier, redacts secrets and writes an append-only outbox; sinks deliver to a file, stdout, the reference receiver, spacesheep or any HTTPS receiver; a control channel flows back from a receiver through core to the harness." xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="var(--fg2)"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="var(--brand)"/></marker></defs>
<g fill="var(--fg2)" font-size="11" font-weight="600" letter-spacing=".06em"><text x="60" y="22">HARNESSES</text><text x="280" y="22">ADAPTERS</text><text x="470" y="22">CORE</text><text x="720" y="22">SINKS</text></g>
<g fill="var(--card)" stroke="var(--line)"><rect x="20" y="36" width="164" height="28" rx="6"/><rect x="20" y="70" width="164" height="28" rx="6"/><rect x="20" y="104" width="164" height="28" rx="6"/><rect x="20" y="138" width="164" height="28" rx="6"/><rect x="20" y="172" width="164" height="28" rx="6"/><rect x="20" y="206" width="164" height="28" rx="6"/><rect x="20" y="240" width="164" height="28" rx="6"/></g>
<g fill="var(--fg)"><text x="32" y="55">Claude Code</text><text x="32" y="89">Codex</text><text x="32" y="123">Gemini CLI</text><text x="32" y="157">Antigravity</text><text x="32" y="191">Cursor</text><text x="32" y="225">Copilot CLI</text><text x="32" y="259">Droid · Kiro · OpenCode</text></g>
<g stroke="var(--fg2)" stroke-width="1.2" marker-end="url(#ar)"><path d="M184 50h46"/><path d="M184 84h46"/><path d="M184 118h46"/><path d="M184 152h46"/><path d="M184 186h46"/><path d="M184 220h46"/><path d="M184 254h46"/></g>
<rect x="232" y="36" width="150" height="232" rx="10" fill="var(--bg2)" stroke="var(--line)"/>
<g fill="var(--fg)"><text x="248" y="62" font-weight="600">one file each</text><text x="248" y="84" fill="var(--fg2)">hook stdin → events</text><text x="248" y="106" fill="var(--fg2)">transcript reader</text><text x="248" y="128" fill="var(--fg2)">facts: title, url,</text><text x="248" y="146" fill="var(--fg2)">model, account</text><text x="248" y="176" fill="var(--fg2)">the only vendor</text><text x="248" y="194" fill="var(--fg2)">code in the tree</text></g>
<path d="M382 152h56" stroke="var(--fg2)" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="440" y="36" width="224" height="232" rx="10" fill="var(--card)" stroke="var(--brand)" stroke-width="1.5"/>
<g fill="var(--fg)"><text x="456" y="62" font-weight="600">normalise</text><text x="456" y="84" fill="var(--fg2)" font-size="12">ULID, seq, session block</text><text x="456" y="112" font-weight="600">filter to a tier</text><text x="456" y="134" fill="var(--fg2)" font-size="12">allowlist per type, per sink</text><text x="456" y="162" font-weight="600">redact</text><text x="456" y="184" fill="var(--fg2)" font-size="12">secrets@1 always · pii@1 opt-in</text><text x="456" y="212" font-weight="600">outbox</text><text x="456" y="234" fill="var(--fg2)" font-size="12">append-only JSONL; a cursor per</text><text x="456" y="256" fill="var(--fg2)" font-size="12">sink, moved only on a 2xx</text></g>
<g stroke="var(--fg2)" stroke-width="1.2" marker-end="url(#ar)"><path d="M664 70h36"/><path d="M664 118h36"/><path d="M664 166h36"/><path d="M664 214h36"/></g>
<g fill="var(--card)" stroke="var(--line)"><rect x="702" y="56" width="238" height="28" rx="6"/><rect x="702" y="104" width="238" height="28" rx="6"/><rect x="702" y="152" width="238" height="28" rx="6"/><rect x="702" y="200" width="238" height="28" rx="6"/></g>
<g fill="var(--fg)"><text x="714" y="75">file · stdout   <tspan fill="var(--fg2)">no server at all</tspan></text><text x="714" y="123">sessionpipe-receiver   <tspan fill="var(--fg2)">your laptop</tspan></text><text x="714" y="171">spacesheep.dev   <tspan fill="var(--fg2)">tier 2</tspan></text><text x="714" y="219">any HTTPS receiver   <tspan fill="var(--fg2)">OTLP too</tspan></text></g>
<path d="M821 228V288H102V272" fill="none" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arb)"/>
<text x="461" y="308" text-anchor="middle" fill="var(--brand-text)" font-size="12">control back: answer a permission, queue a message for the next turn</text>
</svg>
