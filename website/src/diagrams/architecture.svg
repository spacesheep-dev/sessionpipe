<svg viewBox="0 0 960 316" role="img" aria-label="Architecture: five coding-agent harnesses fire hooks that merge into sessionpipe on your machine, which adapts, normalises, filters to a tier, redacts secrets and writes an append-only outbox; one stream of events goes out to the sessionpipe GUI, spacesheep.dev, the reference receiver, a file or stdout, or any HTTPS receiver; a control channel flows back from a receiver to the harness." xmlns="http://www.w3.org/2000/svg" font-family="Geist,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">
