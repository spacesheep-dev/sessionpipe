version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # Minor and patch bumps ride together; a major (TypeScript 7 removed `baseUrl`,
      # 2026-10-05) gets its own PR so one breaking change can't block the whole group.
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # A Biome minor changes lint rules and its config schema (2.5 → 2.6 failed lint on every
      # cell, #171), so it never rides in the group: it gets a PR of its own, with `biome migrate`
      # and the rule diff reviewed. Patches still come.
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
