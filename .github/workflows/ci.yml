name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts CI on its release/v<version> branch: the PR it opens
  # starts no workflows of its own, and these checks are what let that PR merge.
  workflow_dispatch:

# Actions are pinned to a commit, with the release it is in the comment (Dependabot moves both).
# No job here writes to the repository, so none keeps the checkout's token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint (Biome)
        run: npm run lint
      - name: Types (tsc --noEmit)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: proto/ lints and schemas/v1 is what it generates
        run: npm run schemas -- --check
      - name: Unit tests (vitest)
        run: npm test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
      - name: Unit tests with coverage thresholds (vitest)
        run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - name: Conformance fixtures
        run: npm run conformance
      - name: Fixture secret scan
        run: npm run fixture-scan
      - name: Hook timing (p50 ≤ 300 ms on a shared runner)
        run: npm run bench:hook -- --max-p50 300
      - name: npm audit (warning only)
        run: npm audit --omit=dev || true
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Every commit, whoever its author says it is: Dependabot and the release workflow sign
        # theirs off too. The one commit that needs no line is a merge that is nothing but its
        # two parents put together (GitHub's "Update branch"): it carries nobody's work. A merge
        # with a conflict resolved or a change added by hand is somebody's, and is signed off.
        run: |
          set -e
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            parents="$(git log -1 --format=%P "$sha")"
            if [ "$(echo "$parents" | wc -w)" -eq 2 ] \
              && merged="$(git merge-tree --write-tree $parents 2>/dev/null)" \
              && [ "$merged" = "$(git rev-parse "$sha^{tree}")" ]; then
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+@.\+>'; then
              echo "::error::commit $sha has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  proto-additive:
    name: A proto change is additive
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: buf breaking against the base, so a change on the wire is additive (spec/VERSIONING.md)
        working-directory: proto
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE"
          if git cat-file -e "$base:proto/buf.yaml" 2>/dev/null; then
            ../node_modules/.bin/buf breaking --against "../.git#ref=$base,subdir=proto"
          else
            echo "the base has no proto/ yet; nothing to compare"
          fi

  spec-fixture:
    name: A spec change carries a fixture
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: spec/*.md changed → conformance/ or schemas/ changed too
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD)
          spec=$(echo "$changed" | grep -E '^spec/(PROTOCOL|HTTP|PRIVACY|CONTROL|ADAPTERS|VERSIONING)\.md$' || true)
          fixture=$(echo "$changed" | grep -E '^(conformance/|schemas/)' || true)
          if [ -n "$spec" ] && [ -z "$fixture" ]; then
            echo "::error::spec changed ($spec) with no change under conformance/ or schemas/ — add the fixture that proves it"
            exit 1
          fi
          echo "ok"

  adapter-fixture:
    name: An adapter change carries a fixture or a test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: packages/core/src/adapters/ changed → conformance/harness/ or packages/core/test/ changed too
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD)
          adapter=$(echo "$changed" | grep -E '^packages/core/src/adapters/' || true)
          # A hook mapping is proved by a recorded fixture; what an adapter reads from the
          # harness's own files (facts, transcripts, install) has no payload to record, so a
          # test under packages/core/test/ proves that.
          fixture=$(echo "$changed" | grep -E '^(conformance/harness/|packages/core/test/)' || true)
          if [ -n "$adapter" ] && [ -z "$fixture" ]; then
            echo "::error::adapter changed ($adapter) with no change under conformance/harness/ or packages/core/test/ — add the fixture or test that proves it"
            exit 1
          fi
          echo "ok"
