name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts CI on its release/v<version> branch: the PR it opens
  # starts no workflows of its own, and these checks are what let that PR merge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint (Biome)
        run: npm run lint
      - name: Types (tsc --noEmit)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Schemas in sync with the Zod source
        run: npm run schemas -- --check
      - name: Unit tests (vitest)
        run: npm test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
      - name: Unit tests with coverage thresholds (vitest)
        run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - name: Conformance fixtures
        run: npm run conformance
      - name: Fixture secret scan
        run: npm run fixture-scan
      - name: Hook timing (p50 ≤ 300 ms on a shared runner)
        run: npm run bench:hook -- --max-p50 300
      - name: npm audit (warning only)
        run: npm audit --omit=dev || true
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: |
          set -e
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            case "$(git log -1 --format=%ae "$sha")" in *dependabot*|*github-actions*) continue;; esac
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+<.\+@.\+>'; then
              echo "::error::commit $sha has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  spec-fixture:
    name: A spec change carries a fixture
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: spec/*.md changed → conformance/ or schemas/ changed too
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD)
          spec=$(echo "$changed" | grep -E '^spec/(PROTOCOL|HTTP|PRIVACY|CONTROL|ADAPTERS|VERSIONING)\.md$' || true)
          fixture=$(echo "$changed" | grep -E '^(conformance/|schemas/)' || true)
          if [ -n "$spec" ] && [ -z "$fixture" ]; then
            echo "::error::spec changed ($spec) with no change under conformance/ or schemas/ — add the fixture that proves it"
            exit 1
          fi
          echo "ok"

  adapter-fixture:
    name: An adapter change carries a fixture or a test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: packages/core/src/adapters/ changed → conformance/harness/ or packages/core/test/ changed too
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD)
          adapter=$(echo "$changed" | grep -E '^packages/core/src/adapters/' || true)
          # A hook mapping is proved by a recorded fixture; what an adapter reads from the
          # harness's own files (facts, transcripts, install) has no payload to record, so a
          # test under packages/core/test/ proves that.
          fixture=$(echo "$changed" | grep -E '^(conformance/harness/|packages/core/test/)' || true)
          if [ -n "$adapter" ] && [ -z "$fixture" ]; then
            echo "::error::adapter changed ($adapter) with no change under conformance/harness/ or packages/core/test/ — add the fixture or test that proves it"
            exit 1
          fi
          echo "ok"
